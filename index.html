    this.text('♥ ' + this.lives, 12, 16, 12, '#f87171', 'left');
    this.text(this.score, this.W - 12, 16, 14, '#22d3ee', 'right');
  }
}

/* ============================================================
   10. PING PONG
   ============================================================ */
class PongGame extends GameBase {
  getAspectRatio() { return 4 / 3; }
  getControls() { return 'drag-y'; }
  reset() {
    this.ph = 50; this.pw = 8;
    this.px = 12;
    this.py = this.H / 2 - this.ph / 2;
    this.ax = this.W - 20;
    this.ay = this.H / 2 - this.ph / 2;
    this.bx = this.W / 2; this.by = this.H / 2;
    this.bdx = 220 * (Math.random() > 0.5 ? 1 : -1);
    this.bdy = NanoGames.rand(-150, 150);
    this.score = 0; this.aiScore = 0;
    this._endScheduled = false;
    this.setScore(0);
  }
  update(dt) {
    this.bx += this.bdx * dt;
    this.by += this.bdy * dt;
    if (this.by < 6 || this.by > this.H - 6) this.bdy *= -1;
    if (this.bx - 6 < this.px + this.pw && this.bx + 6 > this.px &&
        this.by > this.py && this.by < this.py + this.ph && this.bdx < 0) {
      this.bdx = Math.abs(this.bdx) * 1.05;
      this.bdy += (this.by - (this.py + this.ph / 2)) * 3;
      this.bdy = NanoGames.clamp(this.bdy, -300, 300);
      Audio.tap();
    }
    const target = this.by - this.ph / 2;
    this.ay += (target - this.ay) * Math.min(1, dt * 5);
    this.ay = NanoGames.clamp(this.ay, 0, this.H - this.ph);
    if (this.bx + 6 > this.ax && this.bx - 6 < this.ax + this.pw &&
        this.by > this.ay && this.by < this.ay + this.ph && this.bdx > 0) {
      this.bdx = -Math.abs(this.bdx);
      this.bdy += (this.by - (this.ay + this.ph / 2)) * 3;
    }
    if (this.bx < 0) { this.aiScore++; this._resetBall(1); }
    if (this.bx > this.W) { this.score++; this.setScore(this.score); Audio.score(); this._resetBall(-1); }
    if (!this._endScheduled && (this.score >= 5 || this.aiScore >= 5)) {
      this._endScheduled = true;
      this.setTimeout(() => this.gameOver(this.score), 100);
    }
  }
  _resetBall(dir) {
    this.bx = this.W / 2; this.by = this.H / 2;
    this.bdx = 220 * dir;
    this.bdy = NanoGames.rand(-150, 150);
  }
  onDrag(nx, ny) { this.py = NanoGames.clamp(ny * this.H - this.ph / 2, 0, this.H - this.ph); }
  render() {
    this.bg();
    this.rect(this.W / 2 - 1, 0, 2, this.H, 'rgba(255,255,255,0.15)');
    this.rrect(this.px, this.py, this.pw, this.ph, 3, '#22d3ee');
    this.rrect(this.ax, this.ay, this.pw, this.ph, 3, '#f87171');
    this.circle(this.bx, this.by, 5, '#fff');
    this.text(this.score + ' - ' + this.aiScore, this.W / 2, 20, 14, '#fff');
  }
}

/* ============================================================
   11. DOODLE JUMP
   ============================================================ */
class DoodleGame extends GameBase {
  getAspectRatio() { return 9 / 16; }
  getControls() { return 'drag-h'; }
  reset() {
    this.px = this.W / 2;
    this.py = this.H - 100;
    this.vy = 0;
    this.platforms = [];
    this.camY = 0;
    for (let i = 0; i < 8; i++) {
      const pw = 60;
      this.platforms.push({ x: NanoGames.rand(10, Math.max(11, this.W - pw - 10)), y: this.H - i * 70 - 60, w: pw });
    }
    this.score = 0;
    this.setScore(0);
  }
  update(dt) {
    this.vy += 1400 * dt;
    this.py += this.vy * dt;
    if (this.py > this.H) { Audio.hit(); return this.gameOver(this.score); }
    if (this.vy > 0) {
      for (const p of this.platforms) {
        if (this.px + 12 > p.x && this.px - 12 < p.x + p.w &&
            this.py > p.y && this.py < p.y + 12) {
          this.vy = -650;
          Audio.jump();
          break;
        }
      }
    }
    if (this.py < this.H * 0.4) {
      const diff = this.H * 0.4 - this.py;
      this.py = this.H * 0.4;
      this.platforms.forEach(p => p.y += diff);
      this.camY += diff;
      const s = Math.floor(this.camY / 10);
      if (s !== this.score) { this.score = s; this.setScore(s); }
      while (this.platforms[0].y > this.H) {
        this.platforms.shift();
        const pw = 60;
        const last = this.platforms[this.platforms.length - 1];
        this.platforms.push({ x: NanoGames.rand(10, Math.max(11, this.W - pw - 10)), y: last.y - NanoGames.rand(60, 90), w: pw });
      }
    }
  }
  onDrag(nx) { this.px = NanoGames.clamp(nx * this.W, 12, this.W - 12); }
  render() {
    this.bg();
    this.platforms.forEach(p => this.rrect(p.x, p.y, p.w, 10, 4, '#34d399'));
    this.circle(this.px, this.py, 14, '#22d3ee');
    this.circle(this.px - 4, this.py - 4, 2, '#0a0e1a');
    this.circle(this.px + 4, this.py - 4, 2, '#0a0e1a');
    this.text(this.score + 'm', this.W - 12, 20, 14, '#22d3ee', 'right');
  }
}

/* ============================================================
   12. BOMB DEFUSE
   ============================================================ */
class BombGame extends GameBase {
  getAspectRatio() { return 4 / 3; }
  getControls() { return 'none'; }
  reset() {
    this.score = 0;
    this.setScore(0);
    this._newRound();
  }
  _newRound() {
    const colors = ['#f87171', '#60a5fa', '#34d399', '#fbbf24', '#a78bfa', '#fb923c'];
    const n = NanoGames.rand(3, 5);
    this.wires = [];
    const shuffled = [...colors].sort(() => Math.random() - 0.5);
    for (let i = 0; i < n; i++) this.wires.push(shuffled[i]);
    this.correct = NanoGames.rand(0, n - 1);
    this.time = 4;
    this.wireY = this.H * 0.55;
  }
  update(dt) {
    this.time -= dt;
    if (this.time <= 0) { Audio.hit(); return this.gameOver(this.score); }
  }
  onTap(nx, ny) {
    if (ny < 0.5 || ny > 0.75) return;
    const idx = Math.floor(nx * this.wires.length);
    if (idx < 0 || idx >= this.wires.length) return;
    if (idx === this.correct) {
      this.score++;
      this.setScore(this.score);
      Audio.score();
      this._newRound();
    } else {
      Audio.hit();
      this.gameOver(this.score);
    }
  }
  render() {
    this.bg();
    this.text('BOMB', this.W / 2, 30, 24, '#f87171');
    this.text(this.time.toFixed(1) + 's', this.W / 2, 60, 18, '#fbbf24');
    const wireW = this.W / this.wires.length;
    this.wires.forEach((c, i) => {
      const x = i * wireW + wireW / 2;
      this.rect(x - 4, this.wireY, 8, this.H * 0.15, c);
      this.rect(x - 8, this.wireY - 8, 16, 8, '#666');
    });
    this.text('Tap the correct wire', this.W / 2, this.H - 20, 12, '#7a87a8');
    this.text(this.score, this.W - 12, 20, 14, '#22d3ee', 'right');
  }
}

/* ============================================================
   13. WHACK A MOLE
   ============================================================ */
class WhackGame extends GameBase {
  getAspectRatio() { return 1; }
  getControls() { return 'none'; }
  reset() {
    this.score = 0;
    this.setScore(0);
    this.holes = Array.from({length: 9}, () => ({ mole: false, timer: 0 }));
    this.spawnTimer = 0;
    this.timeLeft = 30;
  }
  update(dt) {
    this.timeLeft -= dt;
    if (this.timeLeft <= 0) { Audio.hit(); return this.gameOver(this.score); }
    this.spawnTimer -= dt;
    if (this.spawnTimer <= 0) {
      this.spawnTimer = Math.max(0.35, 0.9 - this.score * 0.02);
      const idx = NanoGames.rand(0, 8);
      if (!this.holes[idx].mole) { this.holes[idx].mole = true; this.holes[idx].timer = 1.2; }
    }
    this.holes.forEach(h => {
      if (h.mole) {
        h.timer -= dt;
        if (h.timer <= 0) h.mole = false;
      }
    });
  }
  onTap(nx, ny) {
    const cx = Math.floor(nx * 3);
    const cy = Math.floor(ny * 3);
    const idx = cy * 3 + cx;
    if (idx < 0 || idx > 8) return;
    if (this.holes[idx].mole) {
      this.holes[idx].mole = false;
      this.score++;
      this.setScore(this.score);
      Audio.eat();
    }
  }
  render() {
    this.bg();
    const cw = this.W / 3, ch = this.H / 3;
    for (let i = 0; i < 9; i++) {
      const cx = (i % 3) * cw;
      const cy = Math.floor(i / 3) * ch;
      this.rrect(cx + 6, cy + 6, cw - 12, ch - 12, 8, '#1a2238');
      if (this.holes[i].mole) {
        this.circle(cx + cw / 2, cy + ch / 2, Math.min(cw, ch) * 0.3, '#fbbf24');
        this.circle(cx + cw / 2 - 8, cy + ch / 2 - 6, 3, '#0a0e1a');
        this.circle(cx + cw / 2 + 8, cy + ch / 2 - 6, 3, '#0a0e1a');
      }
    }
    this.text(this.timeLeft.toFixed(0) + 's', this.W / 2, 12, 12, '#f87171');
    this.text(this.score, this.W - 12, 12, 14, '#22d3ee', 'right');
  }
}

/* ============================================================
   14. SIMON SAYS
   ============================================================ */
class SimonGame extends GameBase {
  getAspectRatio() { return 1; }
  getControls() { return 'none'; }
  reset() {
    this.score = 0;
    this.setScore(0);
    this.colors = ['#f87171', '#34d399', '#60a5fa', '#fbbf24'];
    this.seq = []; this.userIdx = 0;
    this.state = 'idle'; this.highlight = -1; this.timer = 0;
    this._nextLevel();
  }
  _nextLevel() {
    this.seq.push(NanoGames.rand(0, 3));
    this.userIdx = 0;
    this.state = 'show';
    this.showIdx = 0;
    this.timer = 0.5;
  }
  update(dt) {
    if (this.state === 'show') {
      this.timer -= dt;
      if (this.timer <= 0) {
        this.highlight = -1;
        if (this.showIdx >= this.seq.length) {
          this.state = 'input';
          this.userIdx = 0;
        } else {
          this.highlight = this.seq[this.showIdx++];
          this.timer = 0.5;
          Audio.tap();
        }
      }
    }
  }
  onTap(nx, ny) {
    if (this.state !== 'input') return;
    let idx;
    if (nx < 0.5 && ny < 0.5) idx = 0;
    else if (nx >= 0.5 && ny < 0.5) idx = 1;
    else if (nx < 0.5) idx = 2;
    else idx = 3;
    this.highlight = idx;
    Audio.tap();
    this.setTimeout(() => { this.highlight = -1; }, 200);
    if (idx !== this.seq[this.userIdx]) {
      Audio.hit();
      return this.gameOver(this.score);
    }
    this.userIdx++;
    if (this.userIdx >= this.seq.length) {
      this.score++;
      this.setScore(this.score);
      Audio.score();
      this.state = 'wait';
      this.setTimeout(() => { this._nextLevel(); }, 500);
    }
  }
  render() {
    this.bg();
    const cx = this.W / 2, cy = this.H / 2;
    const r = Math.min(this.W, this.H) * 0.4;
    const quads = [
      [cx-r, cy-r, r, r], [cx, cy-r, r, r],
      [cx-r, cy, r, r], [cx, cy, r, r]
    ];
    quads.forEach((q, i) => {
      this.ctx.globalAlpha = this.highlight === i ? 1 : 0.5;
      this.ctx.fillStyle = this.highlight === i ? '#fff' : this.colors[i];
      this.ctx.fillRect(q[0], q[1], q[2], q[3]);
    });
    this.ctx.globalAlpha = 1;
    this.text(this.score, this.W / 2, 20, 16, '#fff');
    if (this.state === 'show') this.text('Watch...', this.W / 2, this.H - 20, 12, '#7a87a8');
    if (this.state === 'input') this.text('Your turn!', this.W / 2, this.H - 20, 12, '#22d3ee');
  }
}

/* ============================================================
   15. MEMORY CARD
   ============================================================ */
class MemoryGame extends GameBase {
  getAspectRatio() { return 1; }
  getControls() { return 'none'; }
  reset() {
    const emojis = ['🍎','🍌','🍇','🍓','🍒','🍊','🍋','🍑'];
    const pairs = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
    this.cards = pairs.map(e => ({ emoji: e, flipped: false, matched: false }));
    this.flipped = [];
    this.moves = 0;
    this.locked = false;
    this.setScore(0);
  }
  onTap(nx, ny) {
    if (this.locked) return;
    const col = Math.floor(nx * 4);
    const row = Math.floor(ny * 4);
    if (col < 0 || col > 3 || row < 0 || row > 3) return;
    const idx = row * 4 + col;
    const c = this.cards[idx];
    if (c.flipped || c.matched) return;
    c.flipped = true;
    this.flipped.push(idx);
    Audio.tap();
    if (this.flipped.length === 2) {
      this.moves++;
      this.setScore(this.moves);
      this.locked = true;
      this.setTimeout(() => {
        const [a, b] = this.flipped;
        if (this.cards[a].emoji === this.cards[b].emoji) {
          this.cards[a].matched = true;
          this.cards[b].matched = true;
          Audio.score();
        } else {
          this.cards[a].flipped = false;
          this.cards[b].flipped = false;
          Audio.hit();
        }
        this.flipped = [];
        this.locked = false;
        if (this.cards.every(cc => cc.matched)) this.gameOver(this.moves);
      }, 700);
    }
  }
  render() {
    this.bg();
    const cs = Math.min(this.W, this.H) / 4;
    const ox = (this.W - cs * 4) / 2;
    const oy = (this.H - cs * 4) / 2;
    this.cards.forEach((c, i) => {
      const x = ox + (i % 4) * cs + 3;
      const y = oy + Math.floor(i / 4) * cs + 3;
      let color = '#1a2238';
      if (c.matched) color = '#34d39944';
      else if (c.flipped) color = '#22d3ee';
      this.rrect(x, y, cs - 6, cs - 6, 6, color);
      this.text(c.flipped || c.matched ? c.emoji : '?', x + (cs - 6) / 2, y + (cs - 6) / 2, cs * 0.45, '#fff');
    });
    this.text('Moves: ' + this.moves, this.W - 12, 14, 12, '#22d3ee', 'right');
  }
}

/* ============================================================
   16. ASTEROID
   ============================================================ */
class AsteroidGame extends GameBase {
  getAspectRatio() { return 1; }
  getControls() { return 'dpad-fire'; }
  reset() {
    this.px = this.W / 2;
    this.py = this.H / 2;
    this.bullets = []; this.rocks = [];
    this.timer = 1;
    this.score = 0;
    this.setScore(0);
  }
  update(dt) {
    this.timer -= dt;
    if (this.timer <= 0) {
      this.timer = Math.max(0.4, 1 - this.score * 0.02);
      const side = NanoGames.rand(0, 3);
      let x, y;
      if (side === 0) { x = NanoGames.rand(0, this.W); y = -20; }
      else if (side === 1) { x = this.W + 20; y = NanoGames.rand(0, this.H); }
      else if (side === 2) { x = NanoGames.rand(0, this.W); y = this.H + 20; }
      else { x = -20; y = NanoGames.rand(0, this.H); }
      const dx = this.px - x, dy = this.py - y, d = Math.hypot(dx, dy) || 1;
      this.rocks.push({ x, y, vx: dx / d * 80, vy: dy / d * 80, r: 14 });
    }
    this.bullets.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; });
    this.bullets = this.bullets.filter(b => b.x > -10 && b.x < this.W + 10 && b.y > -10 && b.y < this.H + 10);
    this.rocks.forEach(r => { r.x += r.vx * dt; r.y += r.vy * dt; });
    for (let i = this.rocks.length - 1; i >= 0; i--) {
      const r = this.rocks[i];
      if (Math.hypot(r.x - this.px, r.y - this.py) < r.r + 10) {
        Audio.hit();
        return this.gameOver(this.score);
      }
      for (let j = this.bullets.length - 1; j >= 0; j--) {
        const b = this.bullets[j];
        if (Math.hypot(b.x - r.x, b.y - r.y) < r.r) {
          this.bullets.splice(j, 1);
          this.rocks.splice(i, 1);
          this.score++;
          this.setScore(this.score);
          Audio.score();
          break;
        }
      }
    }
    this.rocks = this.rocks.filter(r => r.x > -50 && r.x < this.W + 50 && r.y > -50 && r.y < this.H + 50);
  }
  onInput(a, st) {
    if (st !== 'press') return;
    const sp = 20;
    if (a === 'up') this.py -= sp;
    if (a === 'down') this.py += sp;
    if (a === 'left') this.px -= sp;
    if (a === 'right') this.px += sp;
    this.px = NanoGames.clamp(this.px, 10, this.W - 10);
    this.py = NanoGames.clamp(this.py, 10, this.H - 10);
    if (a === 'fire' && this.rocks.length > 0) {
      let nearest = this.rocks[0];
      let nearestDist = Math.hypot(nearest.x - this.px, nearest.y - this.py);
      for (const r of this.rocks) {
        const d = Math.hypot(r.x - this.px, r.y - this.py);
        if (d < nearestDist) { nearest = r; nearestDist = d; }
      }
      const dx = nearest.x - this.px, dy = nearest.y - this.py, d = nearestDist || 1;
      this.bullets.push({ x: this.px, y: this.py, vx: dx / d * 400, vy: dy / d * 400 });
      Audio.tap();
    }
  }
  render() {
    this.bg();
    this.rocks.forEach(r => this.circle(r.x, r.y, r.r, '#94a3b8'));
    this.bullets.forEach(b => this.circle(b.x, b.y, 3, '#22d3ee'));
    this.circle(this.px, this.py, 10, '#22d3ee');
    this.text(this.score, this.W - 12, 14, 14, '#fff', 'right');
  }
}

/* ============================================================
   17. FROGGER
   ============================================================ */
class FroggerGame extends GameBase {
  constructor(c) { super(c); this.COLS = 9; }
  getAspectRatio() { return 9 / 16; }
  getControls() { return 'dpad'; }
  reset() {
    this.row = this.COLS - 1;
    this.col = Math.floor(this.COLS / 2);
    this.lanes = [];
    for (let i = 0; i < this.COLS - 1; i++) {
      this.lanes.push({
        cars: [],
        speed: NanoGames.rand(-120, 120) || 100,
        timer: Math.random()
      });
    }
    this.score = 0;
    this.setScore(0);
    this._calc();
  }
  _calc() {
    this._cs = Math.min(this.W / this.COLS, this.H / this.COLS);
    this._ox = (this.W - this._cs * this.COLS) / 2;
    this._oy = (this.H - this._cs * this.COLS) / 2;
  }
  onResize() { if (this.lanes) this._calc(); }
  update(dt) {
    this.lanes.forEach((lane, i) => {
      lane.timer -= dt;
      if (lane.timer <= 0) {
        lane.timer = Math.max(0.6, 1.5 - this.score * 0.05);
        lane.cars.push({ x: lane.speed > 0 ? -50 : this.W + 50 });
      }
      lane.cars.forEach(c => c.x += lane.speed * dt);
      lane.cars = lane.cars.filter(c => c.x > -80 && c.x < this.W + 80);
      const px = this._ox + this.col * this._cs + this._cs / 2;
      const py = this._oy + this.row * this._cs + this._cs / 2;
      const laneY = this._oy + i * this._cs + this._cs / 2;
      for (const c of lane.cars) {
        if (Math.abs(c.x - px) < 25 && Math.abs(laneY - py) < 12) {
          Audio.hit();
          return this.gameOver(this.score);
        }
      }
    });
  }
  onInput(a, st) {
    if (st !== 'press') return;
    if (a === 'up') this.row--;
    if (a === 'down') this.row++;
    if (a === 'left') this.col--;
    if (a === 'right') this.col++;
    this.col = NanoGames.clamp(this.col, 0, this.COLS - 1);
    this.row = NanoGames.clamp(this.row, 0, this.COLS - 1);
    Audio.tap();
    if (this.row === 0) {
      this.score++;
      this.setScore(this.score);
      Audio.score();
      this.row = this.COLS - 1;
      this.col = Math.floor(this.COLS / 2);
    }
  }
  render() {
    this.bg();
    const cs = this._cs, ox = this._ox, oy = this._oy;
    for (let r = 0; r < this.COLS; r++) {
      this.rect(ox, oy + r * cs, cs * this.COLS, cs - 1, r === 0 ? 'rgba(52,211,153,0.3)' : '#1a2238');
    }
    this.lanes.forEach((lane, i) => {
      const y = oy + i * cs + cs / 2;
      lane.cars.forEach(c => this.rrect(c.x - 25, y - 10, 50, 20, 4, '#f87171'));
    });
    this.circle(ox + this.col * cs + cs / 2, oy + this.row * cs + cs / 2, cs * 0.35, '#22d3ee');
    this.text(this.score, this.W - 12, 14, 14, '#fff', 'right');
  }
}

/* ============================================================
   18. DODGE BALL
   ============================================================ */
class DodgeGame extends GameBase {
  getAspectRatio() { return 1; }
  getControls() { return 'dpad'; }
  reset() {
    this.px = this.W / 2;
    this.py = this.H / 2;
    this.balls = [];
    this.timer = 0.6;
    this.score = 0;
    this.time = 0;
    this.setScore(0);
  }
  update(dt) {
    this.time += dt;
    this.timer -= dt;
    if (this.timer <= 0) {
      this.timer = Math.max(0.2, 0.6 - this.time * 0.005);
      const edge = NanoGames.rand(0, 3);
      let x, y;
      if (edge === 0) { x = NanoGames.rand(0, this.W); y = -10; }
      else if (edge === 1) { x = this.W + 10; y = NanoGames.rand(0, this.H); }
      else if (edge === 2) { x = NanoGames.rand(0, this.W); y = this.H + 10; }
      else { x = -10; y = NanoGames.rand(0, this.H); }
      const dx = this.px - x, dy = this.py - y, d = Math.hypot(dx, dy) || 1;
      const sp = 100 + this.time * 5;
      this.balls.push({ x, y, vx: dx / d * sp, vy: dy / d * sp });
    }
    this.balls.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; });
    for (const b of this.balls) {
      if (Math.hypot(b.x - this.px, b.y - this.py) < 18) {
        Audio.hit();
        return this.gameOver(this.score);
      }
    }
    this.balls = this.balls.filter(b => b.x > -30 && b.x < this.W + 30 && b.y > -30 && b.y < this.H + 30);
    const s = Math.floor(this.time);
    if (s !== this.score) { this.score = s; this.setScore(s); }
  }
  onInput(a, st) {
    if (st !== 'press') return;
    const sp = 18;
    if (a === 'up') this.py -= sp;
    if (a === 'down') this.py += sp;
    if (a === 'left') this.px -= sp;
    if (a === 'right') this.px += sp;
    this.px = NanoGames.clamp(this.px, 15, this.W - 15);
    this.py = NanoGames.clamp(this.py, 15, this.H - 15);
  }
  render() {
    this.bg();
    this.balls.forEach(b => this.circle(b.x, b.y, 8, '#f87171'));
    this.circle(this.px, this.py, 12, '#22d3ee');
    this.text(this.score + 's', this.W - 12, 14, 14, '#fff', 'right');
  }
}

/* ============================================================
   19. FRUIT NINJA
   ============================================================ */
class FruitGame extends GameBase {
  getAspectRatio() { return 9 / 16; }
  getControls() { return 'drag-free'; }
  reset() {
    this.fruits = [];
    this.slices = [];
    this.timer = 1;
    this.score = 0;
    this.setScore(0);
    this.trail = [];
  }
  update(dt) {
    this.timer -= dt;
    if (this.timer <= 0) {
      this.timer = Math.max(0.4, 1 - this.score * 0.01);
      this.fruits.push({
        x: NanoGames.rand(40, Math.max(41, this.W - 40)),
        y: this.H + 20,
        vx: NanoGames.rand(-40, 40),
        vy: -500 - Math.random() * 100,
        emoji: ['🍎','🍌','🍇','🍓','🍒','🍊'][NanoGames.rand(0, 5)]
      });
    }
    this.fruits.forEach(f => { f.vy += 900 * dt; f.x += f.vx * dt; f.y += f.vy * dt; });
    this.fruits = this.fruits.filter(f => f.y < this.H + 40);
    this.slices.forEach(s => s.life -= dt);
    this.slices = this.slices.filter(s => s.life > 0);
    this.trail.forEach(t => t.life -= dt);
    this.trail = this.trail.filter(t => t.life > 0);
  }
  onDrag(nx, ny, phase) {
    if (phase === 'end') return;
    const x = nx * this.W, y = ny * this.H;
    this.trail.push({ x, y, life: 0.3 });
    for (let i = this.fruits.length - 1; i >= 0; i--) {
      const f = this.fruits[i];
      if (Math.hypot(f.x - x, f.y - y) < 45) {
        this.fruits.splice(i, 1);
        this.slices.push({ x: f.x, y: f.y, life: 0.3 });
        this.score++;
        this.setScore(this.score);
        Audio.score();
      }
    }
  }
  render() {
    this.bg();
    this.fruits.forEach(f => {
      this.ctx.font = '30px system-ui';
      this.ctx.textAlign = 'center';
      this.ctx.textBaseline = 'middle';
      this.ctx.fillText(f.emoji, f.x, f.y);
    });
    this.trail.forEach(t => {
      this.ctx.globalAlpha = t.life / 0.3;
      this.circle(t.x, t.y, 6, '#22d3ee');
      this.ctx.globalAlpha = 1;
    });
    this.slices.forEach(s => {
      this.ctx.globalAlpha = s.life / 0.3;
      this.circle(s.x, s.y, 20, '#22d3ee');
      this.ctx.globalAlpha = 1;
    });
    this.text(this.score, this.W - 12, 14, 14, '#fff', 'right');
  }
}

/* ============================================================
   20. TREASURE HUNTER
   ============================================================ */
class TreasureGame extends GameBase {
  constructor(c) { super(c); this.GRID = 10; }
  getAspectRatio() { return 1; }
  getControls() { return 'dpad'; }
  reset() {
    this.px = 0; this.py = 0;
    this.treasures = [];
    this.score = 0;
    this.setScore(0);
    this._spawnTreasure();
    this._calc();
  }
  _calc() {
    const s = Math.min(this.W, this.H);
    this.cs = s / this.GRID;
    this.ox = (this.W - s) / 2;
    this.oy = (this.H - s) / 2;
  }
  onResize() { if (this.treasures) this._calc(); }
  _spawnTreasure() {
    for (let i = 0; i < 100; i++) {
      const x = NanoGames.rand(0, this.GRID - 1);
      const y = NanoGames.rand(0, this.GRID - 1);
      if (x === this.px && y === this.py) continue;
      if (this.treasures.some(t => t.x === x && t.y === y)) continue;
      this.treasures.push({ x, y });
      return;
    }
  }
  onInput(a, st) {
    if (st !== 'press') return;
    if (a === 'up') this.py--;
    if (a === 'down') this.py++;
    if (a === 'left') this.px--;
    if (a === 'right') this.px++;
    this.px = NanoGames.clamp(this.px, 0, this.GRID - 1);
    this.py = NanoGames.clamp(this.py, 0, this.GRID - 1);
    Audio.tap();
    const idx = this.treasures.findIndex(t => t.x === this.px && t.y === this.py);
    if (idx >= 0) {
      this.treasures.splice(idx, 1);
      this.score++;
      this.setScore(this.score);
      Audio.eat();
      this._spawnTreasure();
    }
  }
  render() {
    this.bg();
    const { cs, ox, oy, GRID } = this;
    this.rect(ox, oy, cs * GRID, cs * GRID, '#0b0f1c');
    for (let i = 1; i < GRID; i++) {
      this.rect(ox + i * cs, oy, 1, cs * GRID, 'rgba(255,255,255,0.05)');
      this.rect(ox, oy + i * cs, cs * GRID, 1, 'rgba(255,255,255,0.05)');
    }
    this.treasures.forEach(t => {
      this.text('💎', ox + t.x * cs + cs / 2, oy + t.y * cs + cs / 2, cs * 0.7, '#fbbf24');
    });
    this.circle(ox + this.px * cs + cs / 2, oy + this.py * cs + cs / 2, cs * 0.35, '#22d3ee');
    this.text(this.score, this.W - 12, 14, 14, '#fff', 'right');
  }
}

    NanoGames.games.forEach(game => {
      const level = Storage.getAchievementLevel(game.id);
      const best = Storage.getHighscore(game.id);
      const th = game.ach;
      const inv = game.inverse;
      let nextT = level < th.length ? th[level] : null;
      let pct = 100, lbl = 'Maxed out';
      if (nextT !== null) {
        let raw;
        if (inv) {
          const prev = level === 0 ? 999 : th[level - 1];
          raw = best === 0 ? 0 : NanoGames.clamp((prev - best) / (prev - nextT), 0, 1);
        } else raw = NanoGames.clamp(best / nextT, 0, 1);
        pct = Math.round(raw * 100);
        lbl = `Best ${best} / ${nextT}`;
      }
      const pips = th.map((_, i) => {
        const on = i < level;
        const cls = on ? (level === th.length ? 'pip gold' : 'pip on') : 'pip';
        return `<div class="${cls}"></div>`;
      }).join('');
      const lvl = level === th.length ? `<span class="ach-level gold">MAX</span>` : `<span class="ach-level">Lv ${level}/${th.length}</span>`;
      const card = document.createElement('div');
      card.className = 'ach-card';

/* ============================================================
   ROUTER — dengan cleanup penuh
   ============================================================ */
const Router = (() => {
  let cur = null, def = null;
  let _keyboardCleanup = null;
  let _canvasCleanups = [];
  let _currentScore = 0;

  function cleanupAll() {
    if (_keyboardCleanup) { _keyboardCleanup(); _keyboardCleanup = null; }
    _canvasCleanups.forEach(fn => { try { fn(); } catch(e) {} });
    _canvasCleanups = [];
  }

  function openGame(game) {
    cleanupAll();
    UI.closeModal();

    _currentScore = 0; // reset skor

    Audio.unlock();
    Audio.click();
    UI.showScreen('game');
    def = game;

    const canvas = document.getElementById('game-canvas');
    const g = game.factory(canvas);
    cur = g;

    const best = Storage.getHighscore(game.id);
    document.getElementById('hud-score').textContent = '0';
    document.getElementById('hud-best').textContent = best;

    g.onScoreChange = s => {
      if (g.destroyed || cur !== g) return;
      _currentScore = s;
      document.getElementById('hud-score').textContent = s;
      document.getElementById('hud-best').textContent = Math.max(Storage.getHighscore(game.id), s);
      checkAch(game, s);
    };

    g.onGameOver = s => {
      if (g.destroyed || cur !== g) return;
      const nb = Storage.setHighscore(game.id, s);
      Audio.gameOver();
      g.setTimeout(() => {
        if (g.destroyed || cur !== g) return;
        UI.showGameOver(game, s, Storage.getHighscore(game.id), nb);
      }, 400);
    };

    setupControls(game, g);
    g.start();
  }

  function checkAch(game, score) {
    const lvl = Storage.getAchievementLevel(game.id);
    let nl = lvl;
    game.ach.forEach((t, i) => {
      const hit = game.inverse ? score <= t : score >= t;
      if (hit && lvl < i + 1) nl = Math.max(nl, i + 1);
    });
    if (nl > lvl) {
      Storage.setAchievementLevel(game.id, nl);
      UI.showAchievement(game, nl, game.ach[nl - 1]);
    }
  }

  function setupControls(game, g) {
    const c = document.getElementById('game-controls');
    c.innerHTML = '';
    const type = g.getControls();
    const canvas = document.getElementById('game-canvas');

    if (type === 'dpad' || type === 'dpad-fire' || type === 'dpad-ab') {
      const dpad = document.createElement('div');
      dpad.className = 'dpad';
      dpad.innerHTML = `
        <button class="dpad-btn dpad-up" data-dir="up">▲</button>
        <button class="dpad-btn dpad-left" data-dir="left">◀</button>
        <button class="dpad-btn dpad-right" data-dir="right">▶</button>
        <button class="dpad-btn dpad-down" data-dir="down">▼</button>
      `;
      dpad.querySelectorAll('.dpad-btn').forEach(btn => {
        const fire = e => {
          e.preventDefault();
          if (g.destroyed || cur !== g) return;
          Audio.tap();
          g.onInput(btn.dataset.dir, 'press');
        };
        btn.addEventListener('touchstart', fire, { passive: false });
        btn.addEventListener('mousedown', fire);
      });
      c.appendChild(dpad);

      if (type === 'dpad-fire') {
        const fb = document.createElement('button');
        fb.className = 'action-btn';
        fb.textContent = '🔥';
        const fire = e => { e.preventDefault(); if (g.destroyed || cur !== g) return; g.onInput('fire', 'press'); };
        fb.addEventListener('touchstart', fire, { passive: false });
        fb.addEventListener('mousedown', fire);
        c.appendChild(fb);
      } else if (type === 'dpad-ab') {
        const a = document.createElement('button');
        a.className = 'action-btn';
        a.textContent = '🔄';
        const fa = e => { e.preventDefault(); if (g.destroyed || cur !== g) return; g.onInput('a', 'press'); };
        a.addEventListener('touchstart', fa, { passive: false });
        a.addEventListener('mousedown', fa);
        c.appendChild(a);

        const b = document.createElement('button');
        b.className = 'action-btn';
        b.textContent = '⬇';
        const fb = e => { e.preventDefault(); if (g.destroyed || cur !== g) return; g.onInput('b', 'press'); };
        b.addEventListener('touchstart', fb, { passive: false });
        b.addEventListener('mousedown', fb);
        c.appendChild(b);
      }
    } else if (type === 'tap') {
      c.innerHTML = '<div class="control-hint">Tap canvas to play</div>';
    } else if (type === 'drag-h') {
      c.innerHTML = '<div class="control-hint">Drag horizontally on canvas</div>';
    } else if (type === 'drag-y') {
      c.innerHTML = '<div class="control-hint">Drag vertically on canvas</div>';
    } else if (type === 'drag-free') {
      c.innerHTML = '<div class="control-hint">Swipe across fruits to slice</div>';
    } else if (type === 'none') {
      c.innerHTML = '<div class="control-hint">Tap on the canvas</div>';
    }

    _canvasCleanups.push(Input.tap(canvas, (nx, ny) => {
      if (g.destroyed || cur !== g) return;
      if (g.onTap) g.onTap(nx, ny);
    }));

    _canvasCleanups.push(Input.drag(canvas, (nx, ny, phase) => {
      if (g.destroyed || cur !== g) return;
      if (g.onDrag) g.onDrag(nx, ny, phase);
    }));

    if (_keyboardCleanup) { _keyboardCleanup(); _keyboardCleanup = null; }
    _keyboardCleanup = Input.keyboard(a => {
      if (g.destroyed || cur !== g) return;
      if (a === 'pause') pause();
      else if (g.onInput) g.onInput(a, 'press');
    });
  }

  function pause() {
    if (!cur || cur.paused || cur.over || cur.destroyed) return;
    cur.pause();
    UI.showPauseMenu();
  }

  function resume() {
    if (!cur || cur.destroyed) { UI.closeModal(); return; }
    UI.closeModal();
    cur.resume();
  }

  function restart() {
    if (!cur) return;
    const d = def;
    cleanupAll();
    cur.stop();
    cur = null;
    UI.closeModal();
    openGame(d);
  }

  function close() {
    cleanupAll();
    if (cur) { cur.stop(); cur = null; }
    UI.closeModal();
    def = null;
    _currentScore = 0;
    UI.showScreen('menu');
    UI.renderMenu();
  }

  // ==== FITUR BARU: Save & Quit ====
  function saveAndQuit() {
    const score = _currentScore;
    const gameDef = def;
    if (cur && gameDef && score > 0) {
      const nb = Storage.setHighscore(gameDef.id, score);
      if (nb) UI.toast(`🏆 New best: ${score}`);
      else UI.toast(`💾 Saved: ${score}`);
    }
    close();
  }

  function getCurrentScore() { return _currentScore; }

  return {
    openGame,
    pauseGame: pause,
    resumeGame: resume,
    restartGame: restart,
    closeGame: close,
    saveAndQuit,
    getCurrentScore
  };
})();
/* ============================================================
   BOOTSTRAP
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  Storage.init();
  Audio.setEnabled(Storage.getSetting('sound'));
  UI.renderMenu();

  document.getElementById('nav-achievements').addEventListener('click', () => {
    Audio.click();
    UI.renderAchievements();
    UI.showScreen('achievements');
  });
  document.getElementById('nav-settings').addEventListener('click', () => {
    Audio.click();
    document.getElementById('set-sound').checked = Storage.getSetting('sound');
    document.getElementById('set-vibration').checked = Storage.getSetting('vibration');
    UI.showScreen('settings');
  });
  document.getElementById('nav-about').addEventListener('click', () => {
    Audio.click();
    UI.showCredits();
  });

  document.querySelectorAll('[data-back]').forEach(btn => {
    btn.addEventListener('click', () => {
      Audio.click();
      UI.showScreen('menu');
      UI.renderMenu();
    });
  });

  document.getElementById('game-back').addEventListener('click', () => {
    Audio.click();
    Router.closeGame();
  });
  document.getElementById('game-pause').addEventListener('click', () => {
    Audio.click();
    Router.pauseGame();
  });

  document.getElementById('set-sound').addEventListener('change', e => {
    Storage.setSetting('sound', e.target.checked);
    Audio.setEnabled(e.target.checked);
    if (e.target.checked) Audio.click();
  });
  document.getElementById('set-vibration').addEventListener('change', e => {
    Storage.setSetting('vibration', e.target.checked);
    Audio.click();
  });
  document.getElementById('btn-reset').addEventListener('click', () => {
    UI.showModal({
      title: '⚠️ Reset Data?',
      body: 'Semua highscore & achievement akan dihapus permanen.',
      actions: [
        {
          label: 'Ya, Reset',
          onClick: () => {
            Storage.reset();
            UI.closeModal();
            UI.renderMenu();
            UI.toast('Data direset');
          }
        },
        { label: 'Batal', primary: true, onClick: () => UI.closeModal() }
      ]
    });
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) Router.pauseGame();
  });

  const unlock = () => {
    Audio.unlock();
    document.removeEventListener('touchstart', unlock);
    document.removeEventListener('click', unlock);
  };
  document.addEventListener('touchstart', unlock, { once: true });
  document.addEventListener('click', unlock, { once: true });

  setTimeout(() => {
    const s = document.getElementById('splash');
    if (s) { s.classList.add('hide'); setTimeout(() => s.remove(), 500); }
  }, 800);
});
</script>
</body>
